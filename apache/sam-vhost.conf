<VirtualHost 127.0.0.1:8088>
    ServerName localhost
    DocumentRoot "F:/sam"
    DirectoryIndex index.php

    <Directory "F:/sam">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/sam-error.log"
    CustomLog "logs/sam-access.log" combined
</VirtualHost>
